name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Print datastore dependency tree
        run: gradle :app:dependencies --configuration debugRuntimeClasspath > deps.txt || true

      - name: Filter datastore lines
        run: grep -i "datastore\|firebase-common\|firebase-installations\|firebase-sessions" deps.txt > deps_filtered.txt || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: deps-report
          path: deps_filtered.txt

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
